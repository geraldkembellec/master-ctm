<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="utf-8">
    <title>Intéger vidéo Youtube</title>
  </head>
  <body>
    <article>
      <h1>Intéger une vidéo Youtube</h1>
      <section >
        <h2>Méthode 1 : Balise "embed"</h2>
        <p> Embed definit un contenu d'une application tierce</p>
        <embed src="https://www.youtube.com/embed/uz52vOg7is4" 
               allowfullscreen="true" 
               alt="Ca charge pas" 
               width="560" height="315">
      </section>
      <section>
      <h2>Méthode 2 : Balise "iframe"</h2>
      <iframe width="560" height="315" 
        src="https://www.youtube.com/embed/uz52vOg7is4?si=reUgWMYrQqlcNxfo" 
        title="YouTube video player" 
        frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
        Ca charge pas ...
      </iframe>
      </section>
      <h2>Méthode 3 : Balise "object"</h2>
      <object width="425" height="344" data="https://www.youtube.com/embed/F9Bo89m2f6g">
          Ca charge pas ...
      </object>
      <section>
      <h3></h3>
      </section>
    </article>
  </body>
</html>
