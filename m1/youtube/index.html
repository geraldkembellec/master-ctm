<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="utf-8">
    <title>Intéger vidéo Youtube</title>
  </head>
  <body>
    <article>
      <h1>Intéger une vidéo Youtube</h1>
      <section >
        <h2>Méthode 1 : Balise "Embed"</h2>
        <p> \<embed\> 	Defines a container for an external application</p>
        <embed src="https://www.youtube.com/embed/F9Bo89m2f6g" 
               allowfullscreen="true" 
               alt="Texte alternatif" 
               width="425" height="344">
      </section>
    </article>
  </body>
</html>
